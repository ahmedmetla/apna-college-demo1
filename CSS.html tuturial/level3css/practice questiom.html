<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: cadetblue;
            padding: 10px;
            
        }
        
        header {
            width: 100%;
            height: 10vh;
            background-color: black;
            border: 2px solid pink;
            margin-bottom: 10px;
        }
        
        main {
            background-color: chartreuse;
            width: 100%;
            height: 10vh;
            border: 2px solid pink;
            margin-bottom: 10px;
        }
        
        footer {
            background-color: aqua;
            width: 100%;
            height: 10vh;
            border: 2px solid pink;
        }
        
        
    </style>
</head>
<body>
    <header>
        <button>click Me</button>
    </header>
    <main></main>
    <footer></footer>
</body>
</html>
