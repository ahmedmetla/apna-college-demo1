<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color + Width Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            width: 200px;
            height: 200px;
            background-color: chartreuse;
            animation: 
                ahmedwidth 2s alternate 5,
                colors 14s linear infinite; /* Corrected line */
        }
        @keyframes ahmedwidth {
            from { width: 200px; }
            to { width: 800px; }
        }
        @keyframes colors {
            0% { background: #FF0000; }
            14% { background: #FF7F00; }
            28% { background: #FFFF00; }
            42% { background: #00FF00; }
            57% { background: #0000FF; }
            71% { background: #4B0082; }
            85% { background: #9400D3; }
            100% { background: #FF0000; }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
</html>
