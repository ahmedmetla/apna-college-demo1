<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="back">
        <div class="card">
           <div class="search">
            <input type="text" placeholder="search for city">
            <button id="btn"><img src="search.png" alt="search" width="10px"></button>
           </div>
           <div class="weatherstatus"><img src="day.svg" alt="day"></div>
            <h1 id="temp">31°C</h1>
            <h1 id="city">sind pakistan </h1>
            
            <div class="humidity">
                <img src="rainy-2.svg" alt="humidity">
                <h2 id="dh">2%</h2>
                <h2 id="th">humidity</h2>
            </div>
            
            <div class="wind">
                <img src="windc.svg" alt="wind" width="25px">
                <h2 id="dw">2okm</h2>
                <h2 id="tw">wind</h2>
            </div>
        </div>
    </div>
</body>
</html>
